<style>

html{-webkit-text-size-adjust:100%}
body{background:var(--paper);font-family:var(--sans);color:var(--ink);font-size:20px;line-height:1.5;

p{margin-bottom:12px}

.rechnen .r{border-bottom:1px solid var(--rule);padding:14px 0}

.rechnen .r input.wrong{border-color:var(--red);background:#FBEFEC}

.start .gross{font-size:44px;font-weight:600;letter-spacing:-.5px;line-height:1.1;margin-bottom:10px}

/* ---------- Planer ---------- */
.planer{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}

.planlinks{position:sticky;top:150px}

.werkzeug .wname{font-size:20px;font-weight:600;flex:1 1 220px}

.werkzeug button.loesch{color:var(--red);border-color:var(--red)}
.werkzeug .leer{font-size:19px;color:var(--soft)}
.budget{margin-top:10px;font-size:20px}
.budget .bb{height:16px;background:var(--rule);border-radius:8px;overflow:hidden;margin-top:6px}
.budget .bb i{display:block;height:100%;background:var(--ok);width:0}
.budget.drueber .bb i{background:var(--red)}
.budget.drueber b{color:var(--red)}
.seite{background:#fff;border:1px solid var(--rule);padding:14px 16px}
.seite h3{font-size:21px;font-weight:600;margin:4px 0 8px}
.muss{list-style:none;margin:0 0 14px}
.muss li{font-size:19px;padding:4px 0 4px 34px;position:relative}
.muss li::before{content:"";position:absolute;left:0;top:7px;width:22px;height:22px;border:2px solid var(--rule);border-radius:4px}
.muss li.ok::before{background:var(--ok);border-color:var(--ok)}
.muss li.ok::after{content:"";position:absolute;left:7px;top:10px;width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.katg h4{font-size:18px;letter-spacing:1.5px;text-transform:uppercase;color:var(--soft);margin:14px 0 6px}
.kat-item{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;text-align:left;background:#fff;border:1px solid var(--rule);border-left:5px solid var(--blue);padding:6px 10px;margin-bottom:6px;cursor:pointer;color:var(--ink)}
.kat-item svg{width:58px;height:44px;flex-shrink:0}
.kat-item .kt{flex:1;font-size:19px;line-height:1.25}
.kat-item .kt small{display:block;font-size:18px;color:var(--soft)}
.kat-item .plus{font-size:26px;font-weight:700;color:var(--blue);width:30px;text-align:center}
.pruef{margin-top:18px;background:#fff;border:1px solid var(--rule);padding:16px 20px;display:none}
.pruef.zeig{display:block}
.pruef h3{font-size:23px;margin-bottom:8px}
.pruef ul{list-style:none}
.pruef li{font-size:20px;padding:8px 10px 8px 14px;border-left:5px solid var(--red);background:#FBEFEC;margin-bottom:6px;cursor:pointer}
.pruef li.h{border-left-color:var(--wood);background:#FFF6E6}
.pruef li.g{border-left-color:var(--ok);background:#EEF6F1;cursor:default}
.anl{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;font-size:19px;margin:0 0 14px}
.anl div::before{content:"› ";color:var(--blue);font-weight:700}

table.aus{width:100%;border-collapse:collapse;font-size:20px;background:#fff;margin:18px 0}
table.aus th,table.aus td{border:1px solid var(--rule);padding:8px 12px;text-align:left}
table.aus th{background:#EDF2F7;font-weight:600}
table.aus td.re,table.aus th.re{text-align:right;white-space:nowrap}
table.aus tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
.refl label{display:block;font-weight:600;font-size:20px;margin:16px 0 6px}
.refl textarea{width:100%;min-height:96px;font-size:20px;font-family:inherit;padding:10px 12px;border:1px solid var(--rule);resize:vertical}
.fuss{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:30px;padding-top:18px;border-top:2px solid var(--ink)}
.druckkopf{display:none}
.drucktext{display:none}
.nfz{display:flex;gap:18px;flex-wrap:wrap}
.nfl span{display:block;font-weight:600;margin-bottom:6px}
.namefeld .nfl input{width:240px}
.hinweis2{font-size:19px;color:var(--soft);margin:10px 0 0}
.app-tipp{background:#EAF3FB;border-left:5px solid var(--blue);padding:12px 18px;margin-bottom:22px;font-size:20px}
.abgabe{background:#fff;border:2px solid var(--ok);padding:18px 22px;margin:26px 0 0}
.abgabe h3{font-size:24px;margin-bottom:10px}
.abl{list-style:none;margin:0 0 14px}
.abl li{font-size:20px;padding:4px 0 4px 34px;position:relative}
.abl li::before{content:"";position:absolute;left:0;top:7px;width:22px;height:22px;border:2px solid var(--rule);border-radius:4px}
.abl li.ok::before{background:var(--ok);border-color:var(--ok)}
.abl li.ok::after{content:"";position:absolute;left:7px;top:10px;width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
textarea.code{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;padding:10px;border:1px solid var(--rule);margin-top:12px;word-break:break-all}
.lehrer textarea.ein{width:100%;min-height:140px;font-size:18px;font-family:ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--rule)}
.lehrer .kasten{background:#fff;border:1px solid var(--rule);padding:16px 20px;margin:18px 0}
.lehrer .kasten h3{font-size:23px;margin-bottom:8px}
.dateiknopf2{display:inline-flex;align-items:center;position:relative;overflow:hidden;font-size:20px;font-weight:600;min-height:48px;padding:10px 22px;background:#fff;color:var(--ink);border:1px solid var(--rule);border-radius:4px;cursor:pointer}

.tabwrap{overflow-x:auto;background:#fff;border:1px solid var(--rule)}
table.uebers{border-collapse:collapse;width:100%;font-size:19px;min-width:760px}
table.uebers th,table.uebers td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;white-space:nowrap}
table.uebers th{background:#EDF2F7;font-weight:600}

table.uebers .rot{color:var(--red);font-weight:700} table.uebers .gruen{color:var(--ok);font-weight:700}
table.uebers button{font-size:19px;font-weight:600;min-height:48px;padding:0 14px;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:4px;cursor:pointer}
.detail h3{font-size:24px;margin:20px 0 8px}
.detail ul.fl{list-style:none} .detail ul.fl li{font-size:20px;padding:6px 12px;border-left:5px solid var(--red);background:#FBEFEC;margin-bottom:6px}
.detail ul.fl li.h{border-left-color:var(--wood);background:#FFF6E6}
.detail ul.fl li.g{border-left-color:var(--ok);background:#EEF6F1}
.detail .reflt{background:#fff;border:1px solid var(--rule);padding:10px 14px;white-space:pre-wrap;font-size:20px;margin-bottom:10px}
.leiste{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}

@media (max-width:1060px){ .planer{grid-template-columns:1fr} }
@media (max-width:760px){
  .paar,.karten,.legende,.anl{grid-template-columns:1fr}
  h2.tt{font-size:28px}
  .z{flex-direction:column;gap:8px}
  .z .btns{max-width:100%;justify-content:flex-start}
}
@media print{
  @page{size:A4 portrait;margin:12mm}
  .top,.fuss,.zeile2,.stationen,.refl .knopfzeile,.panel,.speicherzeile,.abgabe,.app-tipp{display:none!important}
  body{background:#fff;font-size:12pt}
  .wrap{padding:0;max-width:none}
  .druckkopf{display:block;font-size:12pt;margin-bottom:4mm}
  figure.abb{break-inside:avoid;border:0;padding:0}
  .refl textarea{display:none}
  .drucktext{display:block;border:1px solid #999;min-height:22mm;padding:2mm 3mm;white-space:pre-wrap}
  h2.tt{font-size:20pt}
  table.aus{font-size:11pt;margin:2mm 0} table.aus th,table.aus td{padding:1.2mm 2.5mm}
  .refl label{font-size:11pt;margin:3mm 0 1mm} .refl h3,.wrap h3{font-size:14pt!important}
  .merke,.ziel{font-size:11pt;padding:2mm 4mm;margin:3mm 0}
  figure.abb svg{max-height:120mm}
}

<body>
<div class="top"><div class="in">
  <div class="zeile"><h1>Einrichtungsplaner: Meine erste Wohnung</h1><span class="rechts"><span class="stand" id="stand">Start</span><button class="sichern" id="sichernKnopf" aria-label="Arbeitsstand sichern">Sichern</button></span></div>
  <div class="balken"><i id="balken"></i></div>
  <div class="stationen" id="stationen"></div>
</div></div>
<div class="wrap" id="buehne"></div>
<noscript><p style="padding:20px">Bitte JavaScript aktivieren oder den Ausschneidebogen (PDF) verwenden.</p></noscript>
<script>
/* ===== Gemeinsame Daten und Zeichenfunktionen (Modul + Ausschneidebogen) ===== */
/* Alle Maße in cm, Innenmaße der Räume. Ursprung = linke obere Innenecke des Wohnzimmers. */
const WHG = {
  aussen: {x:-30, y:-30, w:920, h:700},
  budget: 3000,
  raeume: [
    {id:'WZ', name:'Wohnzimmer',   x:0,   y:0,   w:480, h:400},
    {id:'SZ', name:'Schlafzimmer', x:490, y:0,   w:370, h:400},

    {id:'FL', name:'Flur',         x:300, y:410, w:280, h:230},
    {id:'BA', name:'Bad',          x:590, y:410, w:270, h:230}
  ],
  /* Türen: Öffnung in der Wand (ox,oy,ow,oh), Drehpunkt (hx,hy), Breite b, Schwenkbereich (sx,sy) = Quadrant,
     durch = Durchgangszone auf der anderen Seite der Wand */
  tueren: [
    {name:'Wohnungstür', ox:400, oy:640, ow:90, oh:30, hx:490, hy:640, b:90, zu:[400,640], auf:[490,550], q:{x:400,y:550,w:90,h:90}, durch:null},

/* ---------- Hilfsfunktionen ---------- */
function euro(n){return n.toLocaleString('de-DE')+' €';}
function meter(cm){return (cm/100).toFixed(2).replace('.',',');}
function flaeche(r){return (r.w*r.h/10000).toFixed(2).replace('.',',');}
function bbox(p){const k=p.fest?p:KAT[p.k];const q=(p.rot%180)!==0;return {x:p.x,y:p.y,w:q?k.d:k.w,h:q?k.w:k.d};}
function schneidet(a,b){return a.x<b.x+b.w-0.01&&b.x<a.x+a.w-0.01&&a.y<b.y+b.h-0.01&&b.y<a.y+a.h-0.01;}
function innen(a,r){return a.x>=r.x-0.01&&a.y>=r.y-0.01&&a.x+a.w<=r.x+r.w+0.01&&a.y+a.h<=r.y+r.h+0.01;}
function raumVon(b){return WHG.raeume.find(r=>innen(b,r));}
/* Zone vor der Vorderseite (rot 0: vorn = unten) */
function vornZone(b,rot,z){
  if(rot===0)return{x:b.x,y:b.y+b.h,w:b.w,h:z};
  if(rot===90)return{x:b.x-z,y:b.y,w:z,h:b.h};
  if(rot===180)return{x:b.x,y:b.y-z,w:b.w,h:z};
  return{x:b.x+b.w,y:b.y,w:z,h:b.h};
}
/* Zonen an den Längsseiten (für Betten) */
function seitenZonen(b,rot,z){
  if(rot%180===0)return[{x:b.x-z,y:b.y,w:z,h:b.h},{x:b.x+b.w,y:b.y,w:z,h:b.h}];
  return[{x:b.x,y:b.y-z,w:b.w,h:z},{x:b.x,y:b.y+b.h,w:b.w,h:z}];
}
/* Rechteck berührt Viertelkreis der Tür? */
function imSchwenk(b,t){
  const q=t.q; if(!schneidet(b,q))return false;
  const ix=Math.max(b.x,q.x), iy=Math.max(b.y,q.y), ax=Math.min(b.x+b.w,q.x+q.w), ay=Math.min(b.y+b.h,q.y+q.h);
  const cx=Math.min(Math.max(t.hx,ix),ax), cy=Math.min(Math.max(t.hy,iy),ay);
  return Math.hypot(cx-t.hx,cy-t.hy)<t.b-0.5;
}

/* ---------- Sinnbilder (lokal: Breite w nach rechts, Tiefe d nach unten, Rückseite oben) ---------- */
const ST='#16232E';
function sinnbild(typ,w,d,fill){
  fill=fill||'#E7EEF4';
  const R=(x,y,a,b,f,sw,rx)=>`<rect x="${x}" y="${y}" width="${a}" height="${b}" fill="${f||'none'}" stroke="${ST}" stroke-width="${sw||1.5}"${rx?` rx="${rx}"`:''}/>`;
  const L=(x1,y1,x2,y2,sw)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ST}" stroke-width="${sw||1.5}"/>`;
  const C=(cx,cy,r,f)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f||'none'}" stroke="${ST}" stroke-width="1.5"/>`;
  let s=R(0,0,w,d,fill,2.5);
  switch(typ){
    case 'bett':{
      const n=w>=130?2:1, pw=(w-12-(n-1)*6)/n;
      for(let i=0;i<n;i++)s+=R(6+i*(pw+6),8,pw,30,'#fff',1.5,6);
      s+=L(0,48,w,48)+`<path d="M ${w*0.45} ${d} L ${w} ${d*0.72}" stroke="${ST}" stroke-width="1.5" fill="none"/>`;break;}
    case 'nacht': s+=C(w/2,d/2,Math.min(w,d)*0.25,'#fff');break;
    case 'schrank':{const n=Math.round(w/50);for(let i=1;i<n;i++)s+=L(w*i/n,0,w*i/n,d-8);s+=L(0,d-8,w,d-8);break;}
    case 'kommode': s+=L(0,d-7,w,d-7)+L(w/2,0,w/2,d-7,1);break;
    case 'schreibtisch': s+=R(w/2-25,6,50,8,'#fff',1.5);break;
    case 'buerostuhl': s=C(w/2,d/2+4,w*0.36,fill)+`<path d="M ${w*0.12} ${d*0.32} Q ${w/2} ${-d*0.06} ${w*0.88} ${d*0.32}" fill="none" stroke="${ST}" stroke-width="4"/>`;break;
    case 'sofa': s+=R(0,0,w,20,'#C9D6E2',1.5)+R(0,0,20,d,'#C9D6E2',1.5)+R(w-20,0,20,d,'#C9D6E2',1.5);
      for(let i=1;i<3;i++)s+=L(20+(w-40)*i/3,20,20+(w-40)*i/3,d,1);break;
    case 'sessel': s+=R(0,0,w,18,'#C9D6E2',1.5)+R(0,0,16,d,'#C9D6E2',1.5)+R(w-16,0,16,d,'#C9D6E2',1.5);break;
    case 'couchtisch': s=R(0,0,w,d,fill,2.5,14);break;
    case 'tvboard': s+=R(w*0.2,4,w*0.6,6,'#16232E',0);break;
    case 'regal': for(let i=1;i<4;i++)s+=L(w*i/4,0,w*i/4,d,1);s+=L(0,0,w,d,1);break;
    case 'esstisch': break;
    case 'stuhl': s+=R(0,0,w,9,'#C9D6E2',1.5);break;
    case 'kueche': s+=L(0,d-7,w,d-7)+R(20,10,55,38,'#fff',1.5,6)+C(47,29,4)
      +C(w-75,20,8)+C(w-45,20,10)+C(w-75,44,10)+C(w-45,44,8)+L(w/2+5,0,w/2+5,d-7,1);break;
    case 'kuehl': {const cx=w/2,cy=(d-7)/2,r=Math.min(w,d)*0.28;s+=L(0,d-7,w,d-7);for(let a=0;a<3;a++){const t=a*Math.PI/3;s+=L(cx-r*Math.cos(t),cy-r*Math.sin(t),cx+r*Math.cos(t),cy+r*Math.sin(t),2);}break;}
    case 'wm': s+=C(w/2,d/2+3,Math.min(w,d)*0.3,'#fff')+L(0,10,w,10,1);break;
    case 'garderobe': for(let i=1;i<5;i++)s+=C(w*i/5,9,3,'#16232E');s+=L(0,d-6,w,d-6,1);break;
    case 'dusche': s+=L(0,0,w,d,1)+L(w,0,0,d,1)+C(w/2,d/2,5,'#fff');break;
    case 'wc': s=R(w*0.1,0,w*0.8,16,fill,2)+`<ellipse cx="${w/2}" cy="${d*0.6}" rx="${w*0.42}" ry="${d*0.36}" fill="${fill}" stroke="${ST}" stroke-width="2"/>`;break;
    case 'waschbecken': s+=`<ellipse cx="${w/2}" cy="${d*0.55}" rx="${w*0.34}" ry="${d*0.3}" fill="#fff" stroke="${ST}" stroke-width="1.5"/>`;break;
  }
  return s;
}
function drehTransform(x,y,w,d,rot){
  if(rot===0)return `translate(${x} ${y})`;
  if(rot===90)return `translate(${x+d} ${y}) rotate(90)`;
  if(rot===180)return `translate(${x+w} ${y+d}) rotate(180)`;
  return `translate(${x} ${y+w}) rotate(270)`;
}

/* ---------- Grundriss als SVG-Inhalt ---------- */
function grundrissSVG(opt){
  opt=opt||{};
  const A=WHG.aussen; let s='';
  s+=`<rect x="${A.x}" y="${A.y}" width="${A.w}" height="${A.h}" fill="${ST}"/>`;
  for(const r of WHG.raeume){
    s+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${r.id==='BA'?'#F3F6F8':'#fff'}"/>`;
  }
  if(opt.raster){
    for(const r of WHG.raeume){
      let g='';
      for(let x=r.x+50;x<r.x+r.w;x+=50)g+=`<line x1="${x}" y1="${r.y}" x2="${x}" y2="${r.y+r.h}"/>`;
      for(let y=r.y+50;y<r.y+r.h;y+=50)g+=`<line x1="${r.x}" y1="${y}" x2="${r.x+r.w}" y2="${y}"/>`;
      s+=`<g stroke="#DCE3E8" stroke-width="1">${g}</g>`;
    }
  }
  for(const r of WHG.raeume){
    const cx=r.x+r.w/2, cy=r.y+r.h/2;
    s+=`<text x="${cx}" y="${cy-4}" font-size="${opt.gross?30:26}" text-anchor="middle" fill="#9AA8B2" font-weight="bold">${r.name}</text>`;
    s+=`<text x="${cx}" y="${cy+(opt.gross?30:26)}" font-size="${opt.gross?26:22}" text-anchor="middle" fill="#9AA8B2">${flaeche(r)} m²</text>`;
  }
  for(const f of WHG.fenster){
    s+=`<rect x="${f.ox}" y="${f.oy}" width="${f.ow}" height="${f.oh}" fill="#fff" stroke="${ST}" stroke-width="1.5"/>`;
    if(f.ow>f.oh)s+=`<line x1="${f.ox}" y1="${f.oy+f.oh/2}" x2="${f.ox+f.ow}" y2="${f.oy+f.oh/2}" stroke="${ST}" stroke-width="1.5"/>`;
    else s+=`<line x1="${f.ox+f.ow/2}" y1="${f.oy}" x2="${f.ox+f.ow/2}" y2="${f.oy+f.oh}" stroke="${ST}" stroke-width="1.5"/>`;
  }
  for(const t of WHG.tueren){
    s+=`<rect x="${t.ox}" y="${t.oy}" width="${t.ow}" height="${t.oh}" fill="#fff"/>`;
    s+=`<line x1="${t.hx}" y1="${t.hy}" x2="${t.auf[0]}" y2="${t.auf[1]}" stroke="${ST}" stroke-width="3"/>`;
    const sweep=bogenRichtung(t);
    s+=`<path d="M ${t.zu[0]} ${t.zu[1]} A ${t.b} ${t.b} 0 0 ${sweep} ${t.auf[0]} ${t.auf[1]}" fill="none" stroke="${ST}" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  }
  for(const h of WHG.heizung){
    s+=`<rect x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" fill="#F3B9A9" stroke="${ST}" stroke-width="1.5"/>`;
  }
  /* Steckdosen */
  for(const [x,y] of WHG.steckdosen){
    s+=`<g><circle cx="${x}" cy="${y}" r="8" fill="#fff" stroke="${ST}" stroke-width="2"/><line x1="${x-4}" y1="${y}" x2="${x+4}" y2="${y}" stroke="${ST}" stroke-width="2"/></g>`;
  }
  /* Wasseranschluss + TV */
  const W=WHG.wasser;
  s+=`<g><circle cx="${W.x}" cy="${W.y-12}" r="12" fill="#2F7EC1"/><text x="${W.x}" y="${W.y-5}" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">W</text></g>`;
  s+=`<g><rect x="${WHG.tv.x+2}" y="${WHG.tv.y-12}" width="26" height="24" fill="#6B4FA0"/><text x="${WHG.tv.x+15}" y="${WHG.tv.y+6}" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">TV</text></g>`;
  /* feste Sanitärobjekte */
  for(const f of WHG.fest){
    s+=`<g transform="${drehTransform(f.x,f.y,f.w,f.d,f.rot)}">${sinnbild(f.typ,f.w,f.d,'#fff')}</g>`;
  }
  if(opt.masse){
    const m=(x1,y1,x2,y2,t,vert)=>{
      let g=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1F5F9E" stroke-width="1.5"/>`;
      const tk=(x,y)=>`<line x1="${x-6}" y1="${y+6}" x2="${x+6}" y2="${y-6}" stroke="#1F5F9E" stroke-width="2"/>`;
      g+=tk(x1,y1)+tk(x2,y2);
      if(vert)g+=`<text x="${x1-8}" y="${(y1+y2)/2}" font-size="22" fill="#1F5F9E" text-anchor="middle" transform="rotate(-90 ${x1-8} ${(y1+y2)/2})">${t}</text>`;
      else g+=`<text x="${(x1+x2)/2}" y="${y1-8}" font-size="22" fill="#1F5F9E" text-anchor="middle">${t}</text>`;
      return g;
    };
    s+=m(0,-48,480,-48,'4,80')+m(490,-48,860,-48,'3,70');
    s+=m(-48,0,-48,400,'4,00',true)+m(-48,410,-48,640,'2,30',true);
    s+=m(0,700,290,700,'2,90')+m(300,700,580,700,'2,80')+m(590,700,860,700,'2,70');
  }
  return s;
}
function bogenRichtung(t){
  /* Kreuzprodukt entscheidet über Drehsinn des Bogens von "zu" nach "auf" */
  const ax=t.zu[0]-t.hx, ay=t.zu[1]-t.hy, bx=t.auf[0]-t.hx, by=t.auf[1]-t.hy;
  return (ax*by-ay*bx)>0?1:0;
}
function moebelSVG(p,opt){
  opt=opt||{};
  const k=KAT[p.k], b=bbox(p);
  let s=`<g transform="${drehTransform(p.x,p.y,k.w,k.d,p.rot)}">${sinnbild(k.typ,k.w,k.d,opt.fill)}</g>`;
  if(opt.label!==false){
    const kurz=k.kurz||k.name.split(/[ ,(]/)[0];
    const hoch=b.h>b.w;
    const lang=hoch?b.h:b.w, quer=hoch?b.w:b.h;
    let fs=Math.min(22, quer*0.5, lang/(kurz.length*0.62));
    if(fs>=11){
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      s+=`<text x="${cx}" y="${cy+fs*0.35}" font-size="${fs.toFixed(1)}" text-anchor="middle" fill="${ST}" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="4" ${hoch?`transform="rotate(-90 ${cx} ${cy})"`:''}>${kurz}</text>`;
    }
  }
  return s;
}

/* ---------- Planprüfung ---------- */
function pruefePlan(P){
  const fehler=[], hinweise=[], gut=[];
  const stuhlArt=x=>x==='stuhl'||x==='buerostuhl';
  const tisch=x=>x==='esstisch'||x==='schreibtisch'||x==='couchtisch';
  const name=p=>KAT[p.k].name;
  const festB=WHG.fest.map(f=>({fest:true,name:f.name,...f,b:bbox({...f,fest:true,w:f.w,d:f.d})}));
  const alle=P.map(p=>({p,b:bbox(p)}));
  const raumOk=new Set();
  alle.forEach(({p,b},i)=>{
    const k=KAT[p.k], r=raumVon(b);
    if(!r){fehler.push({i,t:`${name(p)}: steht in einer Wand oder ragt in einen anderen Raum.`});return;}
    raumOk.add(i);
    // Überlappung
    alle.forEach((o,j)=>{
      if(j<=i)return;
      if(schneidet(b,o.b)){
        const a=p.k,c=o.p.k;
        if((stuhlArt(a)&&tisch(c))||(stuhlArt(c)&&tisch(a)))return;
        fehler.push({i,j,t:`${name(p)} und ${name(o.p)} überlappen sich.`});
      }
    });
    for(const f of festB) if(schneidet(b,f.b)) fehler.push({i,t:`${name(p)} steht auf ${f.name==='WC'?'dem WC':f.name==='Dusche'?'der Dusche':'dem Waschbecken'}.`});
    // Türen
    for(const t of WHG.tueren){
      if(imSchwenk(b,t)){fehler.push({i,t:`${name(p)} steht im Schwenkbereich der ${t.name} – die Tür geht nicht ganz auf.`});}
      else if(t.durch&&schneidet(b,t.durch)){fehler.push({i,t:`${name(p)} versperrt den Durchgang zur ${t.name}.`});}
    }
    // Heizkörper
    for(const h of WHG.heizung) if(schneidet(b,h.zone)) fehler.push({i,t:`${name(p)} steht vor dem Heizkörper – die Wärme kommt nicht in den Raum.`});
    // Fenster
    if(k.hoch) for(const f of WHG.fenster) if(f.zone&&schneidet(b,f.zone)) fehler.push({i,t:`${name(p)} ist hoch und verdeckt das Fenster.`});
    // Bewegungsfläche vorn
    const frei=z=>innen(z,r)&&!alle.some((o,j)=>j!==i&&schneidet(z,o.b)&&!(stuhlArt(o.p.k)&&tisch(p.k)))&&!festB.some(f=>schneidet(z,f.b));
    if(k.vorn){
      const z=vornZone(b,p.rot,k.vorn);
      if(!frei(z)) fehler.push({i,t:`Vor „${k.name}“ fehlen ${k.vorn} cm Bewegungsfläche – die Vorderseite zeigt zur Wand oder etwas steht im Weg.`});
    }
    if(k.seite){
      const zs=seitenZonen(b,p.rot,k.seite).map(frei);
      if(!zs[0]&&!zs[1]) fehler.push({i,t:`${name(p)}: An keiner Längsseite sind ${k.seite} cm frei – man kommt nicht ins Bett.`});
      else if(k.w>=140&&!(zs[0]&&zs[1])) hinweise.push({i,t:`${name(p)}: Nur eine Längsseite ist frei. Für zwei Personen besser von beiden Seiten zugänglich.`});
    }
    // Anschlüsse
    if(k.wasser){
      const W=WHG.wasser;
      const ok=r.id===W.raum&&p.rot===180&&Math.abs(b.y+b.h-W.y)<1&&W.x>b.x&&W.x<b.x+b.w;
      if(!ok) fehler.push({i,t:`Küchenzeile: Die Spüle braucht den Wasseranschluss (W). Rückseite an die Wand mit dem W stellen.`});
    }
    if(p.k==='wm'&&r.id!=='BA') fehler.push({i,t:`Waschmaschine: Sie braucht Wasser und Abfluss – sie gehört ins Bad.`});
    if(p.k==='kuehl'&&r.id!=='KU') hinweise.push({i,t:`Kühlschrank: Er steht nicht in der Küche. Ist das praktisch?`});
    if(k.typ==='bett'&&r.id!=='SZ') hinweise.push({i,t:`${name(p)}: Das Bett steht nicht im Schlafzimmer.`});
    if(p.k==='tvboard'&&!(r.id==='WZ'&&Math.hypot(Math.max(b.x-WHG.tv.x,0),Math.max(Math.abs(b.y+b.h/2-WHG.tv.y)-b.h/2,0))<40)) hinweise.push({i,t:`TV-Board: Es steht nicht am Antennenanschluss (TV).`});
    if(p.k==='schreibtisch'){
      const nahFenster=WHG.fenster.some(f=>f.zone&&f.raum===r.id&&Math.hypot(Math.max(f.zone.x-(b.x+b.w),b.x-(f.zone.x+f.zone.w),0),Math.max(f.zone.y-(b.y+b.h),b.y-(f.zone.y+f.zone.h),0))<60);
      if(!nahFenster) hinweise.push({i,t:`Schreibtisch: Er steht weit weg vom Fenster – wenig Tageslicht.`});
    }
  });
  const summe=P.reduce((s,p)=>s+KAT[p.k].preis,0);
  if(summe>WHG.budget) fehler.push({t:`Budget überschritten: ${euro(summe)} statt höchstens ${euro(WHG.budget)}.`});
  MUSS.forEach(m=>{ if(!m.ok(P)) fehler.push({t:`Es fehlt noch: ${m.text}.`}); });
  return {fehler,hinweise,summe};
}

</script>
<script>
/* ===== Selbstlernmodul Einrichtungsplan 1.1 ===== */
const SPEICHER='einrichtungsplan-wohnung-v1';
let S={name:'',kuerzel:'',klasse:'',P:[],fertig:[],refl:{},antw:{},station:-1,zeit:0};

let FRUEHER=false;

function sichere(){S.zeit=Date.now();try{localStorage.setItem(SPEICHER,JSON.stringify(S));speicherOk=true;}catch(e){speicherOk=false;}return speicherOk;}
function uhr(t){const d=new Date(t);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';}

function zwischenspeichern(anzeige){
  const ok=sichere();

    anzeige.textContent=ok?'Gespeichert: '+uhr(S.zeit):'Nicht gespeichert! Oben auf „Sichern“ tippen und als Datei sichern.';}
  return ok;
}
function speicherKnopf(text){
  const w=el('span','speicherzeile'); const b=el('button','knopf zweit',text||'Zwischenspeichern'); const s=el('span','gesp');
  b.onclick=()=>zwischenspeichern(s); w.append(b,s); return w;
}
const $=(s,r)=>(r||document).querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IM_RAHMEN=(()=>{try{return window.top!==window;}catch(e){return true;}})();
function wer(){return (S.kuerzel||'').trim()+(S.klasse?' · Klasse '+S.klasse.trim():'');}
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;};
function mischen(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function zahl(t){t=String(t).replace(/\s|€|cm|m²|m/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');return parseFloat(t);}

/* kleines Sinnbild als eigenständiges SVG */
function sbSVG(id,opt){
  const k=KAT[id]||opt; const w=k.w,d=k.d,p=14;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-p} ${-p} ${w+2*p} ${d+2*p}" aria-hidden="true">${sinnbild(k.typ,w,d)}</svg>`;
}
function grundrissFigur(opt){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-75 -78 980 800" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Grundriss der Wohnung">${grundrissSVG(Object.assign({masse:true,gross:true},opt||{}))}${(opt&&opt.moebel)||''}</svg>`;
}

/* ---------- Stationen ---------- */
const SB_TAB=['bett90','bett140','schrank100','sofa','esstisch','stuhl','kueche','kuehl','wm'];
const STATIONEN=[
{nr:1,titel:'Sinnbilder im Einrichtungsplan',dauer:'etwa 15 Minuten',
 ziel:'Du erkennst die Sinnbilder für Möbel und rechnest Möbelmaße in den Maßstab 1 : 50 um.',
 info:()=>`
<p>Im <b>Einrichtungsplan</b> wird die Möblierung auf dem Grundriss geplant – <b>bevor</b> Möbel gekauft werden.
Die Möbel erscheinen als <b>Sinnbilder</b>: Man sieht sie <b>von oben</b>, stark vereinfacht. Alle Sinnbilder
haben denselben <b>Maßstab</b> wie der Grundriss, meist <b>1 : 50</b>. Dann sind 2 cm im Plan 1 m in Wirklichkeit.</p>

${SB_TAB.map(id=>{const k=KAT[id];return `<tr><td class="sb">${sbSVG(id)}</td><td>${k.name}</td><td>${meter(k.w)} m × ${meter(k.d)} m</td><td>${String(k.w/50).replace('.',',')} cm × ${String(k.d/50).replace('.',',')} cm</td></tr>`;}).join('')}

 merke:'Sinnbilder zeigen Möbel von oben. Sie haben denselben Maßstab wie der Grundriss, im Einrichtungsplan meist 1 : 50: 2 cm im Plan sind 1 m in Wirklichkeit. Möbelmaße: Breite × Tiefe.',

<text x="365" y="210" font-size="22" text-anchor="middle" fill="#2E7D4F" font-weight="bold">120 cm</text>

<g transform="translate(560 0)">${sinnbild('bett',90,200)}</g>

<h3>Richtwerte für die Planung</h3>
<table class="tab"><tr><th>Möbel</th><th>frei lassen</th><th>warum?</th></tr>
<tr><td>Küchenzeile</td><td>120 cm davor</td><td>arbeiten, Backofen und Schränke öffnen</td></tr>
<tr><td>Kleiderschrank</td><td>90 cm davor</td><td>Türen öffnen, Kleidung herausnehmen</td></tr>

<tr><td>Kommode, Regal, Garderobe</td><td>60 bis 70 cm davor</td><td>Schubladen ziehen, davor stehen</td></tr>
<tr><td>Bett</td><td>60 cm an einer Längsseite</td><td>ins Bett steigen, Bett beziehen</td></tr>

<h3>Planungsregeln</h3>
<ul>
<li>Türen gehen ganz auf: Im Viertelkreis der Tür steht nichts. Durchgänge bleiben frei.</li>
<li>Heizkörper bleiben frei: mindestens 20 cm Abstand.</li>
<li>Hohe Möbel (Schrank, Regal, Kühlschrank) stehen nicht vor Fenstern.</li>

 merke:'Vor Möbeln bleibt eine Bewegungsfläche frei: 120 cm vor der Küchenzeile, 90 cm vor Schränken, 60 cm neben dem Bett. Türen, Durchgänge, Fenster und Heizkörper bleiben frei. Anschlüsse bestimmen, wo Spüle und Waschmaschine stehen.',
 heft:['Überschrift: <b>Bewegungsflächen und Planungsregeln</b>','Schreibe den Merksatz ab.','Zeichne einen Schrank im Maßstab 1 : 50 und schraffiere seine Bewegungsfläche.'],

 ]},
{nr:3,titel:'Deine erste Wohnung',dauer:'etwa 15 Minuten',

zwei Zimmer, Küche, Bad und Flur. Für die Möbel hast du <b>${euro(WHG.budget)}</b> zur Verfügung.

 merke:'Fläche eines Raumes = Länge × Breite. Die Wohnfläche ist die Summe aller Raumflächen. Der Grundriss zeigt Fenster, Türen, Heizkörper und Anschlüsse – sie bestimmen, wo Möbel stehen können.',
 heft:['Überschrift: <b>Meine erste Wohnung</b>','Notiere die fünf Räume mit ihrer Fläche.','Schreibe die Muss-Liste und das Budget ab.'],
 aufgaben:[
  {typ:'rechnen',frage:'Berechne die Flächen.',hinweis:'Runde auf zwei Stellen nach dem Komma. Trage nur die Zahl ein.',
   items:[['Wohnzimmer: 4,80 m × 4,00 m',19.2,'m²','4,80 × 4,00 = 19,20 m²'],
          ['Schlafzimmer: 3,70 m × 4,00 m',14.8,'m²','3,70 × 4,00 = 14,80 m²'],
          ['Küche: 2,90 m × 2,30 m',6.67,'m²','2,90 × 2,30 = 6,67 m²'],
          ['Wohnfläche gesamt: Wohnzimmer + Schlafzimmer + Küche 6,67 m² + Flur 6,44 m² + Bad 6,21 m²',53.32,'m²','19,20 + 14,80 + 6,67 + 6,44 + 6,21 = 53,32 m²'],
          ['Die Muss-Möbel kosten in der günstigsten Ausführung 2 061 €. Wie viel Geld bleibt vom Budget übrig?',939,'€','3 000 € − 2 061 € = 939 €']],
   tipp:'Fläche = Länge × Breite. Für die Wohnfläche alle fünf Räume addieren.'},
  {typ:'kat',frage:'In welchen Raum gehört das Möbel?',hinweis:'Tippe bei jedem Möbel auf den passenden Raum.',
   kat:['Wohnzimmer','Schlafzimmer','Küche','Flur','Bad'],
   items:[['Küchenzeile mit Spüle',2,'Die Spüle braucht den Wasseranschluss in der Küche.'],

          ['TV-Board',0,'Der Antennenanschluss liegt im Wohnzimmer.'],
          ['Esstisch mit Stühlen',0,'Die Küche ist zu klein für einen Esstisch.']],

 ]},

 ziel:'Du richtest die Wohnung im Maßstab ein, hältst Bewegungsflächen und Regeln ein und bleibst im Budget.'},

/* ---------- Navigation ---------- */
function bauNav(){
  const n=$('#stationen'); n.innerHTML='';
  const b0=el('button',S.station===-1?'on':'','Start'); b0.onclick=()=>zeige(-1); n.appendChild(b0);
  STATIONEN.forEach((st,i)=>{
    const b=el('button',(S.station===i?'on ':'')+(S.fertig.includes(i)?'fertig':''),String(st.nr));
    b.title=st.titel; b.setAttribute('aria-label','Station '+st.nr+': '+st.titel);
    b.onclick=()=>zeige(i); n.appendChild(b);
  });
  $('#balken').style.width=(S.fertig.length/STATIONEN.length*100)+'%';
  $('#stand').textContent=S.station===-2?'Lehrerbereich':S.station<0?'Start':'Station '+STATIONEN[S.station].nr+' von '+STATIONEN.length;
}
function zeige(i){

let dlCap;
async function holeDownloads(){
  if(dlCap!==undefined)return dlCap;

  return dlCap;
}
async function speichereDatei(name,text){

  if(d){ try{ await d.save({filename:name,data:text}); return 'ok'; }catch(e){ return (e&&e.code==='declined')?'abgelehnt':'nein'; } }
  if(IM_RAHMEN) return 'nein';

  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
  return 'ok';
}
function b64u(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function ub64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function kodiere(o){
  const bytes=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){ try{
    const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
    return 'EP2Z.'+b64u(new Uint8Array(buf)); }catch(e){} }
  return 'EP2J.'+b64u(bytes);
}
async function dekodiere(code){
  const p=code.indexOf('.'); const pre=code.slice(0,p); let u=ub64(code.slice(p+1));
  if(pre==='EP2Z'){
    if(!window.DecompressionStream) throw new Error('Dieser Browser kann den Code nicht entpacken. Bitte Safari, Chrome oder Edge in aktueller Version verwenden.');
    u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
  }
  const o=JSON.parse(new TextDecoder().decode(u)); if(!o||o.m!=='ep')throw new Error('Kein Abgabe-Code des Einrichtungsplaners.'); return o;
}

    const a=auswertungVon(o);
    let h=`<h3>${esc(o.k)} · Klasse ${esc(o.c)} · abgegeben ${zeitText(o.t)}</h3>`;
    h+=`<figure class="abb">${grundrissFigur({moebel:a.P.map(p=>'<g>'+moebelSVG(p)+'</g>').join('')})}</figure>`;
    h+='<h3>Prüfergebnis</h3><ul class="fl">';
    if(!a.r.fehler.length)h+='<li class="g">Alle Regeln eingehalten, Budget eingehalten.</li>';
    a.r.fehler.forEach(f=>h+=`<li>${esc(f.t)}</li>`); a.r.hinweise.forEach(f=>h+=`<li class="h">Hinweis: ${esc(f.t)}</li>`);
    h+='</ul>';
    const zaehl={}; a.P.forEach(p=>zaehl[p.k]=(zaehl[p.k]||0)+1);
    h+='<h3>Kostenaufstellung</h3><table class="aus"><tr><th class="re">Anzahl</th><th>Möbel</th><th class="re">Summe</th></tr>';
    KATALOG.filter(k=>zaehl[k.id]).forEach(k=>h+=`<tr><td class="re">${zaehl[k.id]}</td><td>${k.name}</td><td class="re">${euro(k.preis*zaehl[k.id])}</td></tr>`);
    h+=`<tr class="sum"><td></td><td>Gesamt (Budget ${euro(WHG.budget)})</td><td class="re">${euro(a.r.summe)}</td></tr></table>`;
    h+='<h3>Aufgaben der Stationen 1 bis 3</h3><table class="aus"><tr><th>Station</th><th>Aufgabe</th><th class="re">richtig</th></tr>';
    STATIONEN.forEach((st,si)=>(st.aufgaben||[]).forEach((au,ai)=>{const v=(o.e||{})[si+'-'+ai];const n=(au.paare||au.items).length;
      h+=`<tr><td>${st.nr}</td><td>${esc(au.frage)}</td><td class="re">${v?v[0]+' von '+v[1]:'nicht geprüft (0 von '+n+')'}</td></tr>`;}));
    h+='</table><h3>Begründungen</h3>';
    [['zusatz','Zusätzliche Möbel'],['regel','Schwierigste Regel'],['sparen','500 € weniger']].forEach(([kk,t])=>{h+=`<p style="margin:10px 0 4px"><b>${t}</b></p><div class="reflt">${esc((o.r||{})[kk])||'–'}</div>`;});
    det.innerHTML=h;
  }
  zeigeListe();
}
